name: Build macOS App

# Build every branch/tag except the rolling release tag maintained below.
on:
  push:
    branches: ['**']
    tags-ignore: [latest, stable]
  workflow_dispatch:

# Finish the active build; keep only the newest pending build during a push burst.
# Serialization prevents two successful builds from replacing release assets at once.
concurrency:
  group: lightx2v-latest-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and deploy Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      deployments: write
    environment:
      name: macos-arm64
      url: https://github.com/${{ github.repository }}/releases/tag/latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore pinned inference archives
        uses: actions/cache@v4
        with:
          path: Sources/LightX2VCore/Resources/Bundled/*.tar.gz
          key: bundled-inference-${{ hashFiles('Sources/LightX2VCore/Resources/Bundled/manifest.json') }}

      - name: Build signed release app
        run: bash scripts/build.sh

      - name: Package and verify download
        run: bash scripts/package.sh

      - name: Replace latest release and remove obsolete app packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_latest.py dist/LightX2V-APP-macOS-arm64.zip

      - name: Publish download summary
        env:
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/latest/LightX2V-APP-macOS-arm64.zip
        run: |
          {
            printf '## LightX2V APP · Apple Silicon\n\n'
            printf '[Download latest APP](%s)\n\n' "$DOWNLOAD_URL"
            printf -- '- Build commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Target: macOS 14+, arm64\n'
            printf -- '- Package: APP contents, arm64 architecture and signature verified\n'
            printf -- '- Signing: ad-hoc (not notarized)\n'
            printf -- '- Retention: no expiry; one APP package per Latest / Stable channel\n'
            printf -- '- This fixed Latest URL always serves the latest package, including from older run summaries\n'
            printf -- '- Includes LightX2V source and llama.cpp binaries; requires model weights and a Python inference environment\n\n'
            printf 'See the [latest release](https://github.com/%s/releases/tag/latest) for its commit and SHA-256.\n' "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"
