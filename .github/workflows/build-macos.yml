name: Build macOS App

# Build every branch/tag except the rolling release tag maintained below.
on:
  push:
    branches: ['**']
    tags-ignore: [latest]
  workflow_dispatch:

# Finish the active build; keep only the newest pending build during a push burst.
# Serialization prevents two successful builds from replacing release assets at once.
concurrency:
  group: lightx2v-latest-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and deploy Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      deployments: write
    environment:
      name: macos-arm64
      url: https://github.com/${{ github.repository }}/releases/tag/latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python for bridge tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: arm64

      - name: Check build environment
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          swift --version
          python --version

      - name: Install bridge test dependencies
        run: python -m pip install -r Tests/requirements.txt

      - name: Run Swift core checks
        run: swift run LightX2VCoreChecks

      - name: Check workspace setup and discovery
        run: swift run LightX2VSetupChecks

      - name: Check prompt input and IME layout
        run: bash scripts/check-prompt-editor.sh

      - name: Run Python bridge integration tests
        run: python -B -m unittest discover -s Tests -v

      - name: Build signed release app
        run: bash scripts/build.sh

      - name: Package and verify download
        run: bash scripts/package.sh

      - name: Replace latest release and remove obsolete app packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_latest.py dist/LightX2V-APP-macOS-arm64.zip

      - name: Publish download summary
        env:
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/latest/LightX2V-APP-macOS-arm64.zip
        run: |
          {
            printf '## LightX2V APP · Apple Silicon\n\n'
            printf '[Download latest APP](%s)\n\n' "$DOWNLOAD_URL"
            printf -- '- Build commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Target: macOS 14+, arm64\n'
            printf -- '- Tests: Swift core, native prompt editor and Python bridge checks passed\n'
            printf -- '- Signing: ad-hoc (not notarized)\n'
            printf -- '- Retention: no expiry; only the latest successful APP package is kept\n'
            printf -- '- This stable URL always serves the latest package, including from older run summaries\n'
            printf -- '- Requires a local LightX2V checkout, model weights and Python inference environment\n\n'
            printf 'See the [latest release](https://github.com/%s/releases/tag/latest) for its commit and SHA-256.\n' "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"
