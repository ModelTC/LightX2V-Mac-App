name: Build macOS App

# Every push (including branches and tags) gets its own build and download.
# Deliberately do not cancel earlier runs when a new commit is pushed.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and deploy Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    environment:
      name: macos-arm64
      url: ${{ steps.upload.outputs.artifact-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python for bridge tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: arm64

      - name: Check build environment
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          swift --version
          python --version

      - name: Install bridge test dependencies
        run: python -m pip install -r Tests/requirements.txt

      - name: Run Swift core checks
        run: swift run LightX2VCoreChecks

      - name: Run Python bridge integration tests
        run: python -B -m unittest discover -s Tests -v

      - name: Build signed release app
        run: bash scripts/build.sh

      - name: Package and verify download
        id: package
        run: |
          archive="LightX2V-APP-macOS-arm64-${GITHUB_SHA:0:7}.zip"
          bash scripts/package.sh "dist/LightX2V APP.app" "dist/$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Upload application
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish download summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          {
            printf '## LightX2V APP · Apple Silicon\n\n'
            printf '[Download %s](%s)\n\n' "$ARCHIVE" "$ARTIFACT_URL"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Target: macOS 14+, arm64\n'
            printf -- '- Tests: Swift core checks and Python bridge integration tests passed\n'
            printf -- '- Signing: ad-hoc (not notarized)\n'
            printf -- '- Artifact retention: 30 days; sign in to GitHub to download\n'
            printf -- '- Requires a local LightX2V checkout, model weights and Python inference environment\n\n'
            printf '### SHA-256\n\n```text\n'
            cat "dist/$ARCHIVE.sha256"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
